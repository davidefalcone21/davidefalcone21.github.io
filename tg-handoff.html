<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Returning to Telegram…</title>
  <!-- Telegram Mini App SDK. Defines window.Telegram.WebApp when present. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; height: 100%; background: Canvas; color: CanvasText; }
    body {
      display: flex; align-items: center; justify-content: center;
      font: 15px -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    }
    /* Hidden by default. Only shown if the auto-action didn't dismiss the
       page within ~1.5s (i.e. neither close() nor location.replace worked). */
    #fallback {
      display: none; flex-direction: column; align-items: center;
      gap: 14px; padding: 24px; text-align: center;
    }
    #fallback a {
      display: inline-block; padding: 14px 22px; border-radius: 10px;
      background: #2481cc; color: #fff; text-decoration: none; font-weight: 600;
    }
    #fallback .diag {
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: 0.55; word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="fallback">
    <a id="cta" href="https://t.me/askatlas_bot">Open Telegram</a>
    <div class="diag" id="diag"></div>
  </div>
  <script>
    (function () {
      var DEFAULT_DEST = "https://t.me/askatlas_bot";

      // Read ?to= but ONLY accept https://t.me/ links (no open redirector).
      var dest = DEFAULT_DEST;
      try {
        var to = new URLSearchParams(location.search).get("to");
        if (to && /^https:\/\/t\.me\//i.test(to)) dest = to;
      } catch (e) {}
      document.getElementById("cta").setAttribute("href", dest);

      var tg = window.Telegram && window.Telegram.WebApp;
      // platform === "unknown" means the SDK loaded but we're NOT inside a
      // Telegram WebApp session (e.g. a normal browser tab), so bridge calls
      // would be no-ops.
      var inside = !!(tg && tg.platform && tg.platform !== "unknown");

      // Path 1: inside the Telegram mini app webview → close it.
      // close() dismisses the WebView and returns the user to the chat the
      // mini app was opened from (the bot chat). One action, no leftover
      // mini app behind, no second "go back" tap.
      if (inside) {
        try { if (typeof tg.ready === "function") tg.ready(); } catch (e) {}
        try { tg.close(); return; } catch (e) {}
      }

      // Path 2: not in a mini app session (system browser, etc.) → OS deep-link
      // to the bot via t.me. The OS hands the link off to the Telegram app.
      location.replace(dest);

      // Safety net: if neither path actually dismissed the page within 1.5s,
      // reveal a manual fallback (and a tiny diagnostic line so we can see why).
      setTimeout(function () {
        document.getElementById("diag").textContent =
          "inside=" + inside +
          "  platform=" + (tg ? tg.platform : "n/a") +
          "  v=" + (tg ? tg.version : "n/a");
        document.getElementById("fallback").style.display = "flex";
      }, 1500);
    })();
  </script>
</body>
</html>
